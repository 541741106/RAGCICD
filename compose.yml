name: papertrace

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: papertrace_app
      POSTGRES_DB: papertrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
