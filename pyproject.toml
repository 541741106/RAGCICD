[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrag-test"
version = "0.1.0"
description = "An evaluated RAG system for research papers"
requires-python = ">=3.11"

dependencies = [
    "haystack-ai==3.3.0",
    "google-genai==2.31.0",
    "pypdf==6.20.1",
    "fonttools==4.67.0",
    "fastapi==0.146.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88